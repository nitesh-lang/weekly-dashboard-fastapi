# Buybox — Monthly data sync (moved from nitesh-lang/Buybox_report 2026-08-28;
# the buybox app now lives in this repo under buybox_src/).
#
# Runs on the 3rd of every month at 06:37 IST, pulling the previous month:
#   1. AMS Ads   — SP + SD + SB with SB attribution (monthly_buybox_pull.py)
#   2. SP-API 3P — sales & traffic across 5 seller accounts
#   3. SP-API 1P — vendor sales for AUDIOARRAY only (WM 1P dormant)
#
# All required secrets already exist in this repo's store (same names the
# weekly-sync workflow uses). See the original header in Buybox_report for
# the why-the-3rd / why-:07 scheduling notes.

name: Buybox Monthly Sync

on:
  schedule:
    - cron: '7 1 3 * *'        # 3rd of every month, 01:07 UTC = 06:37 IST
  push:
    branches: [main]
    paths:
      - 'buybox_src/data/*/Jan/**'
      - 'buybox_src/data/*/Feb/**'
      - 'buybox_src/data/*/Mar/**'
      - 'buybox_src/data/*/Apr/**'
      - 'buybox_src/data/*/May/**'
      - 'buybox_src/data/*/Jun/**'
      - 'buybox_src/data/*/Jul/**'
      - 'buybox_src/data/*/Aug/**'
      - 'buybox_src/data/*/Sep/**'
      - 'buybox_src/data/*/Oct/**'
      - 'buybox_src/data/*/Nov/**'
      - 'buybox_src/data/*/Dec/**'
      - 'buybox_src/data/master/sku_master.xlsx'
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date YYYY-MM-DD (leave empty = previous calendar month)"
        required: false
        default: ""
      end_date:
        description: "End date YYYY-MM-DD (leave empty = previous calendar month)"
        required: false
        default: ""

permissions:
  contents: write

defaults:
  run:
    working-directory: buybox_src

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      AMS_ADS_CLIENT_ID:                       ${{ secrets.AMS_ADS_CLIENT_ID }}
      AMS_ADS_CLIENT_SECRET:                   ${{ secrets.AMS_ADS_CLIENT_SECRET }}
      AMS_ADS_REFRESH_TOKEN:                   ${{ secrets.AMS_ADS_REFRESH_TOKEN }}
      ADS_REGION:                              ${{ vars.ADS_REGION || 'EU' }}
      SP_LWA_CLIENT_ID:                        ${{ secrets.SP_LWA_CLIENT_ID }}
      SP_LWA_CLIENT_SECRET:                    ${{ secrets.SP_LWA_CLIENT_SECRET }}
      SP_REFRESH_TOKEN_AUDIOARRAY:             ${{ secrets.SP_REFRESH_TOKEN_AUDIOARRAY }}
      SP_REFRESH_TOKEN_CAMBIUMRETAIL:          ${{ secrets.SP_REFRESH_TOKEN_CAMBIUMRETAIL }}
      SP_REFRESH_TOKEN_NEXLEV:                 ${{ secrets.SP_REFRESH_TOKEN_NEXLEV }}
      SP_REFRESH_TOKEN_VIOMI:                  ${{ secrets.SP_REFRESH_TOKEN_VIOMI }}
      SP_REFRESH_TOKEN_WHITEMULBERRY:          ${{ secrets.SP_REFRESH_TOKEN_WHITEMULBERRY }}
      SP_LWA_CLIENT_ID_AUDIOARRAY:             ${{ secrets.SP_LWA_CLIENT_ID_AUDIOARRAY }}
      SP_LWA_CLIENT_SECRET_AUDIOARRAY:         ${{ secrets.SP_LWA_CLIENT_SECRET_AUDIOARRAY }}
      SP_API_VENDOR_REFRESH_TOKEN_AUDIOARRAY:  ${{ secrets.SP_API_VENDOR_REFRESH_TOKEN_AUDIOARRAY }}
      PYTHONIOENCODING:                        utf-8
      PYTHONUNBUFFERED:                        "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: buybox_src/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify credentials present
        run: |
          missing=()
          for k in AMS_ADS_CLIENT_ID AMS_ADS_CLIENT_SECRET AMS_ADS_REFRESH_TOKEN \
                   SP_LWA_CLIENT_ID SP_LWA_CLIENT_SECRET \
                   SP_REFRESH_TOKEN_AUDIOARRAY SP_REFRESH_TOKEN_CAMBIUMRETAIL \
                   SP_REFRESH_TOKEN_NEXLEV SP_REFRESH_TOKEN_VIOMI \
                   SP_REFRESH_TOKEN_WHITEMULBERRY \
                   SP_LWA_CLIENT_ID_AUDIOARRAY SP_LWA_CLIENT_SECRET_AUDIOARRAY \
                   SP_API_VENDOR_REFRESH_TOKEN_AUDIOARRAY; do
            if [ -z "${!k}" ]; then missing+=("$k"); fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing secrets: ${missing[*]}"
            exit 1
          fi
          echo "✓ all required secrets present"

      - name: Resolve target month
        id: dates
        run: |
          if [ -n "${{ github.event.inputs.start_date }}" ] && [ -n "${{ github.event.inputs.end_date }}" ]; then
            START="${{ github.event.inputs.start_date }}"
            END="${{ github.event.inputs.end_date }}"
            echo "Using manual override: $START .. $END"
          else
            START=$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y-%m-01)
            END=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m-%d)
            echo "Using previous calendar month: $START .. $END"
          fi
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"

      - name: Ads — monthly pull (submit + poll + write)
        run: |
          python monthly_buybox_pull.py run \
              --start "${{ steps.dates.outputs.start }}" \
              --end   "${{ steps.dates.outputs.end }}"

      - name: SP-API 3P — seller sales monthly pull
        continue-on-error: true
        run: |
          python monthly_seller_sales_pull.py \
              --start "${{ steps.dates.outputs.start }}" \
              --end   "${{ steps.dates.outputs.end }}"

      - name: SP-API 1P — vendor sales monthly pull (AA only; WM 1P skipped)
        continue-on-error: true
        run: |
          python monthly_vendor_sales_pull.py \
              --start "${{ steps.dates.outputs.start }}" \
              --end   "${{ steps.dates.outputs.end }}"

      - name: Commit + push refreshed CSVs
        run: |
          set -e
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Paths are relative to buybox_src (working-directory) — staging
          # stays scoped to this sub-project.
          # ⚠ TWO traps caught on 2026-09-02 (the day before the first
          # scheduled run), both of which made this step silently stage
          # NOTHING while the workflow stayed green:
          #   1. The pull scripts name month folders "Aug26" (%b%y), not
          #      "2026-08" — the original yyyy-mm globs matched no files.
          #   2. `git add p1 p2 …` REFUSES THE WHOLE COMMAND when any one
          #      pathspec matches nothing, and `|| true` swallowed that —
          #      so even after adding the %b%y globs, one dead pattern
          #      unstaged everything. Each pattern is now added on its own.
          for p in 'data/*/[0-9][0-9][0-9][0-9]-[0-9][0-9]/ads_sp.csv'             \
                   'data/*/[0-9][0-9][0-9][0-9]-[0-9][0-9]/ads_sd.csv'             \
                   'data/*/[0-9][0-9][0-9][0-9]-[0-9][0-9]/ads_sb.csv'             \
                   'data/*/[0-9][0-9][0-9][0-9]-[0-9][0-9]/ads_sb_attributed.csv'  \
                   'data/*/[0-9][0-9][0-9][0-9]-[0-9][0-9]/sales_seller.csv'       \
                   'data/*/[0-9][0-9][0-9][0-9]-[0-9][0-9]/sales_vendor.csv'       \
                   'data/_audit/[0-9][0-9][0-9][0-9]-[0-9][0-9]/*.csv'             \
                   'data/*/[A-Z][a-z][a-z][0-9][0-9]/ads_sp.csv'                   \
                   'data/*/[A-Z][a-z][a-z][0-9][0-9]/ads_sd.csv'                   \
                   'data/*/[A-Z][a-z][a-z][0-9][0-9]/ads_sb.csv'                   \
                   'data/*/[A-Z][a-z][a-z][0-9][0-9]/ads_sb_attributed.csv'        \
                   'data/*/[A-Z][a-z][a-z][0-9][0-9]/sales_seller.csv'             \
                   'data/*/[A-Z][a-z][a-z][0-9][0-9]/sales_vendor.csv'             \
                   'data/_audit/[A-Z][a-z][a-z][0-9][0-9]/*.csv'; do
            git add "$p" 2>/dev/null || true
          done
          echo "Staged files:"
          git diff --cached --name-only | head -40

          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
            exit 0
          fi

          MONTH_LABEL="${{ steps.dates.outputs.start }}"
          git commit -m "data(buybox): monthly ads+sales for ${MONTH_LABEL:0:7} [skip ci]"

          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main || true
            if git push origin main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying after fetch..."
            sleep 5
          done
          echo "::error::Push failed after 3 attempts; remote keeps moving."
          exit 1
