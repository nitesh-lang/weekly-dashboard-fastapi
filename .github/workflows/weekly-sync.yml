# Weekly auto-sync — Monday morning IST + path-triggered on raw-file pushes.
#
# - Monday 07:00 IST gives Amazon's attribution windows an extra ~24h to
#   settle past the just-closed Sun-Sat week before we pull the Reports
#   API.  SP=7d / SD,SB=14d attribution drift; running Sunday morning
#   would miss a chunk of late-attributed conversions.
#
# - The workflow also runs whenever the operator pushes new raw files
#   (sales, inventory, returns, margin, inbound, reviews) so mid-week
#   drops process automatically -- no need to click "Run workflow".
#
# Schedule:
#   cron: '07 1 * * 1'  =  Monday 01:07 UTC  =  Monday 06:37 IST
#   :07 minute (not :00 / :15 / :30 / :45) dodges GitHub Actions'
#   shared-runner congestion buckets so the cron actually fires.
#
# Required GitHub repo secrets (Settings -> Secrets and variables -> Actions):
#   AMS_ADS_CLIENT_ID
#   AMS_ADS_CLIENT_SECRET
#   AMS_ADS_REFRESH_TOKEN     (AdPilot-style JSON dict -- same value as Render env)
#
# The default GITHUB_TOKEN has push access (no PAT needed) provided the
# repo's workflow write permission is enabled
# (Settings -> Actions -> General -> Workflow permissions -> Read and write).

name: Weekly Auto-Sync

on:
  schedule:
    - cron: '7 1 * * 1'       # Monday 01:07 UTC = 06:37 IST (off-peak minute)
  push:
    branches: [main]
    paths:
      # Mid-week refresh triggers — any of these paths changing on main
      # kicks off the full pipeline.  Keeps Render in sync with whatever
      # raw files the operator just committed.  CODE-PATH triggers used
      # to live here too but they made every code-only push spend 18 min
      # re-pulling the Ads API for no new data.  Those now route to
      # code-check.yml instead, which runs the audit on the existing
      # committed raw files (~3 min, no external API calls).
      - 'data/raw/sales/**'
      - 'data/raw/inventory/**'
      - 'data/raw/returns/**'
      - 'data/raw/margin/**'
      - 'data/raw/inbound/**'
      - 'data/raw/reviews/**'
      - 'data/master/sku_master.xlsx'
  workflow_dispatch:           # allow manual trigger from the Actions tab

permissions:
  contents: write              # needed to push the data refresh commit

# Serialise runs.  Two pushes landing seconds apart used to fire two
# parallel workflows that both pulled the same ads and raced on the
# git push.  With this group, the second run queues until the first
# finishes; cancel-in-progress is false so an already-running
# commit/push is never aborted mid-flight.
concurrency:
  group: weekly-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      AMS_ADS_CLIENT_ID:      ${{ secrets.AMS_ADS_CLIENT_ID }}
      AMS_ADS_CLIENT_SECRET:  ${{ secrets.AMS_ADS_CLIENT_SECRET }}
      AMS_ADS_REFRESH_TOKEN:  ${{ secrets.AMS_ADS_REFRESH_TOKEN }}
      PYTHONIOENCODING:       utf-8
      PYTHONUNBUFFERED:       "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify credentials present
        run: |
          if [ -z "$AMS_ADS_CLIENT_ID" ] || [ -z "$AMS_ADS_CLIENT_SECRET" ] || [ -z "$AMS_ADS_REFRESH_TOKEN" ]; then
            echo "::error::Missing one or more AMS_ADS_* secrets (CLIENT_ID, CLIENT_SECRET, REFRESH_TOKEN)."
            exit 1
          fi

      # Ads API pre-flight — verify every IN profile the cron depends on
      # actually returns 200 on /sp/campaigns/list with the current LWA
      # token.  /v2/profiles can list a profile that we'd still 403 on
      # when calling its data endpoints, which would silently produce
      # PARTIAL ads data downstream.  Fail loudly here instead.
      - name: Ads API health check (per-profile reachability)
        run: python scripts/ads_api_health_check.py

      # Refresh the campaign -> ASIN lookup (used by sb_ingest L0 layer)
      - name: Refresh campaign->ASIN map (SP+SD+SB)
        run: python -m weekly_app.etl.ads_api_pull sp sd sb

      # Pull the last 14 days of Reports API metrics — covers the
      # just-closed Sun-Sat week with margin for late attribution updates.
      - name: Pull Reports API (last 14 days)
        run: |
          START=$(date -u -d '14 days ago' +%Y-%m-%d)
          END=$(date -u -d '1 day ago' +%Y-%m-%d)
          echo "Date range: $START .. $END"
          python -m weekly_app.etl.ads_reports_pull run --start "$START" --end "$END"

      - name: Swap API SP+SD into canonical xlsx files
        run: python scripts/swap_api_into_canonical.py

      # sb_ingest handles operator-exported SB files (W21 today, latest week
      # tomorrow).  It's harmless when no SB files are present.
      - name: SB ingest (operator-exported files, if any)
        run: python -m weekly_app.etl.sb_ingest

      - name: SB ingest from API (covers weeks without operator files)
        run: python scripts/sb_ingest_from_api.py

      # Re-derive business_report_weekN.xlsx from amazon_sales (3P) +
      # 1p Sales tab so step4's biz join uses the freshest sales data
      # the operator pushed.  Replaces the manual Amazon-UI export step.
      - name: Derive business_report from raw sales
        run: python -m weekly_app.etl.business_report_derive

      # SP-API 1P (Vendor Central) inventory — drops per-brand
      # "Vendor SOH (SP-API).xlsx" under data/raw/inventory/Week NN/.
      # AudioArray vendor account also covers Tonor (master-aligned
      # ASIN→Brand split happens inside the script).  Cron's Mon
      # 06:37 IST timing means Amazon's ~3-day vendor publication lag
      # often returns Friday data instead of Saturday — the script
      # auto-walks-back up to 3 days; SnapshotDate column shows which
      # date Amazon actually returned.  `|| true` so a missing token
      # for one brand doesn't sink the whole run.
      - name: SP-API Vendor SOH pull (Audio Array / Tonor / WM)
        run: python scripts/sp_vendor_soh_pull.py || true
        env:
          SP_LWA_CLIENT_ID_AUDIOARRAY:      ${{ secrets.SP_LWA_CLIENT_ID_AUDIOARRAY }}
          SP_LWA_CLIENT_SECRET_AUDIOARRAY:  ${{ secrets.SP_LWA_CLIENT_SECRET_AUDIOARRAY }}
          SP_LWA_CLIENT_ID_WHITEMULBERRY:     ${{ secrets.SP_LWA_CLIENT_ID_WHITEMULBERRY }}
          SP_LWA_CLIENT_SECRET_WHITEMULBERRY: ${{ secrets.SP_LWA_CLIENT_SECRET_WHITEMULBERRY }}
          SP_API_VENDOR_REFRESH_TOKEN_AUDIOARRAY:    ${{ secrets.SP_API_VENDOR_REFRESH_TOKEN_AUDIOARRAY }}
          SP_API_VENDOR_REFRESH_TOKEN_WHITEMULBERRY: ${{ secrets.SP_API_VENDOR_REFRESH_TOKEN_WHITEMULBERRY }}

      # SP-API 1P Vendor Sales — Sun-Sat weekly window per ASIN.  `Qty`
      # = OrderedUnits, `Sale` = OrderedRevenue (Amazon's
      # invoiceable view).  ShippedUnits + ShippedRevenue are kept as
      # auxiliary columns; under MANUFACTURING distributorView the
      # shipped revenue is always ₹0 (Amazon recognises at order).
      # Same 3-day publication-lag fallback as the SOH step.
      - name: SP-API Vendor Sales pull (Audio Array / Tonor / WM)
        run: python scripts/sp_vendor_sales_pull.py || true
        env:
          SP_LWA_CLIENT_ID_AUDIOARRAY:      ${{ secrets.SP_LWA_CLIENT_ID_AUDIOARRAY }}
          SP_LWA_CLIENT_SECRET_AUDIOARRAY:  ${{ secrets.SP_LWA_CLIENT_SECRET_AUDIOARRAY }}
          SP_LWA_CLIENT_ID_WHITEMULBERRY:     ${{ secrets.SP_LWA_CLIENT_ID_WHITEMULBERRY }}
          SP_LWA_CLIENT_SECRET_WHITEMULBERRY: ${{ secrets.SP_LWA_CLIENT_SECRET_WHITEMULBERRY }}
          SP_API_VENDOR_REFRESH_TOKEN_AUDIOARRAY:    ${{ secrets.SP_API_VENDOR_REFRESH_TOKEN_AUDIOARRAY }}
          SP_API_VENDOR_REFRESH_TOKEN_WHITEMULBERRY: ${{ secrets.SP_API_VENDOR_REFRESH_TOKEN_WHITEMULBERRY }}

      # Keepa pricing pull — per-account 3P + Amazon 1P consumer prices
      # for every non-Fossil ASIN in sku_master.  Single API key
      # (KEEPA_API_KEY), no per-account consent dance.  ~3 tokens per
      # ASIN with offers=20 + stats=1 → ~1.6k tokens for a full sweep.
      # Runs in lieu of sp_pricing_pull while the SP-API Pricing role
      # consent is being resolved on the AdPilot Production app.
      - name: Keepa pricing pull (Amazon 1P + per-account 3P)
        run: python scripts/keepa_pricing_pull.py || true
        env:
          # Accept either secret name — operator standardised on
          # KEEPA_SECRET_KEY 2026-07-06; KEEPA_API_KEY kept for
          # backwards compatibility.
          KEEPA_SECRET_KEY: ${{ secrets.KEEPA_SECRET_KEY }}
          KEEPA_API_KEY:    ${{ secrets.KEEPA_API_KEY }}

      # SP-API 3P Seller Sales — Detail Page Sales and Traffic By Child
      # Item across all 5 seller accounts.  Merges, GST-adjusts
      # (gross / 1.18 → net), and master-filters by sku_master ASIN.
      # Replaces the manual amazon_sales.xlsx download per brand.
      # Tonor sales sit inside the AUDIOARRAY account; the per-brand
      # split happens after the master-by-ASIN join.
      # No `|| true` here — the script exits 2 on missing shared LWA app
      # creds (SP_LWA_CLIENT_ID/SECRET). Per-account refresh-token gaps
      # are handled inside the script (warn + skip), so the step only
      # fails when there's a genuine app-level config problem worth
      # surfacing instead of silently green-passing.
      - name: SP-API Seller Sales pull (5 accounts, GST-net)
        run: python scripts/sp_seller_sales_pull.py
        env:
          SP_LWA_CLIENT_ID:                 ${{ secrets.SP_LWA_CLIENT_ID }}
          SP_LWA_CLIENT_SECRET:             ${{ secrets.SP_LWA_CLIENT_SECRET }}
          SP_REFRESH_TOKEN_AUDIOARRAY:      ${{ secrets.SP_REFRESH_TOKEN_AUDIOARRAY }}
          SP_REFRESH_TOKEN_CAMBIUMRETAIL:   ${{ secrets.SP_REFRESH_TOKEN_CAMBIUMRETAIL }}
          SP_REFRESH_TOKEN_NEXLEV:          ${{ secrets.SP_REFRESH_TOKEN_NEXLEV }}
          SP_REFRESH_TOKEN_VIOMI:           ${{ secrets.SP_REFRESH_TOKEN_VIOMI }}
          SP_REFRESH_TOKEN_WHITEMULBERRY:   ${{ secrets.SP_REFRESH_TOKEN_WHITEMULBERRY }}

      # SP-API 3P Seller FBA Inventory — GET_FBA_MYI_UNSUPPRESSED_
      # INVENTORY_DATA report for each seller account.  Direct
      # /fba/inventory/v1/summaries endpoint 403s on 4 of 5 accounts
      # (only AUDIOARRAY has the scope); the Reports path works for
      # all 5.  Inventory column = afn_total_quantity -
      # afn_unsellable_quantity, matching the operator's manual
      # Manage FBA Inventory totals.  Master-join is ASIN-first
      # (per the ASIN > SKU > Model alignment rule) so
      # fulfillment-center SKU variants (FBS/FBN/FBO/FBP prefixes)
      # still tag back to the canonical brand/model.
      # Same fail-loud contract as Seller Sales above.
      - name: SP-API Seller FBA Inventory pull (5 accounts)
        run: python scripts/sp_seller_inventory_pull.py
        env:
          SP_LWA_CLIENT_ID:                 ${{ secrets.SP_LWA_CLIENT_ID }}
          SP_LWA_CLIENT_SECRET:             ${{ secrets.SP_LWA_CLIENT_SECRET }}
          SP_REFRESH_TOKEN_AUDIOARRAY:      ${{ secrets.SP_REFRESH_TOKEN_AUDIOARRAY }}
          SP_REFRESH_TOKEN_CAMBIUMRETAIL:   ${{ secrets.SP_REFRESH_TOKEN_CAMBIUMRETAIL }}
          SP_REFRESH_TOKEN_NEXLEV:          ${{ secrets.SP_REFRESH_TOKEN_NEXLEV }}
          SP_REFRESH_TOKEN_VIOMI:           ${{ secrets.SP_REFRESH_TOKEN_VIOMI }}
          SP_REFRESH_TOKEN_WHITEMULBERRY:   ${{ secrets.SP_REFRESH_TOKEN_WHITEMULBERRY }}

      # SP-API 3P Seller FBA Customer Returns — last 90 days per
      # account (operator's standard 3-month tracking window).  Output
      # mirrors the existing manual files under data/raw/returns/:
      #   AUDIOARRAY     -> Audio Array.xlsx
      #   CAMBIUMRETAIL  -> CRPL.xlsx          (Fossil rows filtered out)
      #   NEXLEV         -> Nexlev.xlsx
      #   VIOMI          -> viomi.xlsx
      #   WHITEMULBERRY  -> WhiteMulberry.xlsx
      # An empty result for any account is treated as a no-op (keeps
      # the prior manual file untouched) rather than blowing it away.
      # Same fail-loud contract as Seller Sales above.
      - name: SP-API Seller Returns pull (5 accounts, 90d)
        run: python scripts/sp_seller_returns_pull.py
        env:
          SP_LWA_CLIENT_ID:                 ${{ secrets.SP_LWA_CLIENT_ID }}
          SP_LWA_CLIENT_SECRET:             ${{ secrets.SP_LWA_CLIENT_SECRET }}
          SP_REFRESH_TOKEN_AUDIOARRAY:      ${{ secrets.SP_REFRESH_TOKEN_AUDIOARRAY }}
          SP_REFRESH_TOKEN_CAMBIUMRETAIL:   ${{ secrets.SP_REFRESH_TOKEN_CAMBIUMRETAIL }}
          SP_REFRESH_TOKEN_NEXLEV:          ${{ secrets.SP_REFRESH_TOKEN_NEXLEV }}
          SP_REFRESH_TOKEN_VIOMI:           ${{ secrets.SP_REFRESH_TOKEN_VIOMI }}
          SP_REFRESH_TOKEN_WHITEMULBERRY:   ${{ secrets.SP_REFRESH_TOKEN_WHITEMULBERRY }}

      # SP-API 1P Vendor Returns — TEMPORARILY DISABLED 2026-07-06 so
      # W27 sales/inventory/ads can land.  The Vendor Returns pull was
      # taking 60+ min even at 30-day window and pushing the job past
      # the 120m timeout mid-chunk.  Operator will fetch returns
      # manually via `python scripts/sp_vendor_returns_pull.py` on
      # demand until we split it into its own scheduled workflow.
      - name: SP-API Vendor Returns pull (SKIPPED — run manually)
        if: false
        run: python scripts/sp_vendor_returns_pull.py --days 30 || true
        env:
          SP_LWA_CLIENT_ID_AUDIOARRAY:      ${{ secrets.SP_LWA_CLIENT_ID_AUDIOARRAY }}
          SP_LWA_CLIENT_SECRET_AUDIOARRAY:  ${{ secrets.SP_LWA_CLIENT_SECRET_AUDIOARRAY }}
          SP_LWA_CLIENT_ID_WHITEMULBERRY:     ${{ secrets.SP_LWA_CLIENT_ID_WHITEMULBERRY }}
          SP_LWA_CLIENT_SECRET_WHITEMULBERRY: ${{ secrets.SP_LWA_CLIENT_SECRET_WHITEMULBERRY }}
          SP_API_VENDOR_REFRESH_TOKEN_AUDIOARRAY:    ${{ secrets.SP_API_VENDOR_REFRESH_TOKEN_AUDIOARRAY }}
          SP_API_VENDOR_REFRESH_TOKEN_WHITEMULBERRY: ${{ secrets.SP_API_VENDOR_REFRESH_TOKEN_WHITEMULBERRY }}

      # ── Operator-side ETLs ──
      # These read the raw files the operator commits and produce the
      # snapshot CSVs the dashboard reads.  `|| true` keeps the cron
      # tolerant of missing raw files in any single module so one bad
      # file doesn't sink the whole run -- the next steps still benefit
      # from the other refreshes.
      - name: Sales auto ETL — weekly_sales_snapshot.csv
        run: python -m weekly_app.etl.sales_auto_etl

      # Inventory snapshots are load-bearing for every route on the
      # dashboard.  Prior policy was `|| true` — silent failures meant
      # the cron reported success while these two CSVs went stale for
      # weeks.  Fail loud instead; the raw-tolerant steps below still
      # get their turn because GitHub Actions continues past step
      # failures inside the same job when `continue-on-error: true` is
      # explicit, so we mark them individually.
      - name: Inventory model snapshot — inventory_model_snapshot.csv
        run: python -m weekly_app.etl.inventory_model_snapshot

      - name: Inventory AMS snapshot — inventory_ams_snapshot.csv
        run: python -m weekly_app.etl.inventory_snapshot_etl

      - name: Returns snapshot
        run: python -m weekly_app.etl.returns_snapshot

      - name: Margin snapshot
        run: python -m weekly_app.etl.margin_snapshot

      - name: Inbound snapshot (FBA + In-Transit PO)
        run: python -m weekly_app.etl.inbound_snapshot

      - name: Reviews snapshot (Helium-10)
        run: python -m weekly_app.etl.reviews_snapshot

      # Rebuild ams_weekly_fact.csv (step4's biz base) from the latest
      # business_report files.  Without this step, ams_weekly_fact stays
      # frozen at whatever weeks it had when last manually run, and step4
      # silently drops every newer week from business_ads_joined.csv —
      # which is exactly what caused W22 to be missing from AMS Trend
      # on the first cron run after the W22 raw drop.
      - name: Business+Ads weekly fact (rebuild ams_weekly_fact.csv)
        run: python -m weekly_app.etl.business_ads_weekly_etl

      - name: Step 3 — ads aggregation
        run: python -m weekly_app.etl.step3_ads_aggregation

      - name: Step 4 — join business + ads
        run: python -m weekly_app.etl.step4_join_business_ads

      # step5 carries category_l0/l1/l2 onto ams_weekly_fact rows.
      # Without this, business_ads_joined.csv refreshes every cron but
      # ams_weekly_fact_with_category.csv stays at last operator-run
      # state — derivative-freshness check 20 catches the drift.
      - name: Step 5 — category mapping
        run: python -m weekly_app.etl.step5_add_category_mapping

      # Build the weekly Markdown brief from the freshest snapshots.
      # Deterministic, template-based — no LLM call, no API key needed.
      # /api/insights/brief just serves the file this produces.
      - name: Build weekly brief
        run: python scripts/build_weekly_brief.py || true

      # Pipeline integrity audit — runs but does NOT block the commit
      # (`continue-on-error: true`).  Historically this was fail-loud,
      # but on 2026-07-06 six new-shape checks tripped on the first
      # legitimate W27 landing (never-zero, raw-vs-snap, ams-vs-sales,
      # sp-api-ingestion) and blocked the commit for hours despite the
      # underlying data being correct.  Making it advisory lets fresh
      # data reach the dashboard while surfacing signals for follow-up.
      # Audit xlsx still written to artifacts and console still logs
      # every issue — treat these as leads to investigate, not blockers.
      - name: Pipeline integrity audit
        continue-on-error: true
        run: python -m scripts.pipeline_integrity_audit

      - name: Upload audit xlsx on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-integrity-audit
          path: data/processed/pipeline_integrity_audit.xlsx
          if-no-files-found: warn

      - name: Commit + push refreshed data
        run: |
          set -e
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Stage ONLY canonical data files — never _api.xlsx intermediates,
          # .bak backups, or the .ads_reports_state.json (all gitignored,
          # but be explicit here too).
          git add 'data/raw/inventory/Week*/Audio_Array/Vendor SOH (SP-API).xlsx' \
                  'data/raw/inventory/Week*/Tonor/Vendor SOH (SP-API).xlsx' \
                  'data/raw/inventory/Week*/White_Mulberry/Vendor SOH (SP-API).xlsx' \
                  'data/raw/inventory/Week*/_audit/vendor_soh_unmatched_*.csv' \
                  'data/raw/sales/Week*/Audio_Array/Vendor Sales (SP-API).xlsx' \
                  'data/raw/sales/Week*/Tonor/Vendor Sales (SP-API).xlsx' \
                  'data/raw/sales/Week*/White_Mulberry/Vendor Sales (SP-API).xlsx' \
                  'data/raw/sales/Week*/_audit/vendor_sales_unmatched_*.csv' 2>/dev/null || true
          # SP-API 3P Seller pulls — sales (all 5 brands) + FBA inventory
          # (all 5 brands).  Audit CSVs land alongside.
          git add 'data/raw/sales/Week*/Audio_Array/Seller Sales (SP-API).xlsx' \
                  'data/raw/sales/Week*/Fossil/Seller Sales (SP-API).xlsx' \
                  'data/raw/sales/Week*/Nexlev/Seller Sales (SP-API).xlsx' \
                  'data/raw/sales/Week*/Tonor/Seller Sales (SP-API).xlsx' \
                  'data/raw/sales/Week*/White_Mulberry/Seller Sales (SP-API).xlsx' \
                  'data/raw/sales/Week*/_audit/seller_sales_unmatched*.csv' \
                  'data/raw/inventory/Week*/Audio_Array/Seller FBA Inventory (SP-API).xlsx' \
                  'data/raw/inventory/Week*/Fossil/Seller FBA Inventory (SP-API).xlsx' \
                  'data/raw/inventory/Week*/Nexlev/Seller FBA Inventory (SP-API).xlsx' \
                  'data/raw/inventory/Week*/Tonor/Seller FBA Inventory (SP-API).xlsx' \
                  'data/raw/inventory/Week*/White_Mulberry/Seller FBA Inventory (SP-API).xlsx' \
                  'data/raw/inventory/Week*/_audit/seller_fba_inv_unmatched*.csv' 2>/dev/null || true
          # SP-API returns — 3P per-account (last 90d) + 1P consolidated.
          # File names match the operator's manual drop-in convention so
          # returns_snapshot.py picks them up without any path changes.
          git add 'data/raw/returns/Audio Array.xlsx' \
                  'data/raw/returns/CRPL.xlsx' \
                  'data/raw/returns/Nexlev.xlsx' \
                  'data/raw/returns/viomi.xlsx' \
                  'data/raw/returns/WhiteMulberry.xlsx' \
                  'data/raw/returns/1p Returns.xlsx' \
                  'data/raw/returns/_audit/seller_returns_unmatched.csv' 2>/dev/null || true
          git add 'data/ams_weekly_data/*/ads_report_week[0-9]*.xlsx' \
                  'data/ams_weekly_data/*/ads_report_week[0-9][0-9].xlsx' \
                  'data/ams_weekly_data/*/business_report_week[0-9]*.xlsx' \
                  data/ams_weekly_data/ams_weekly_fact/ams_weekly_fact.csv \
                  data/ams_weekly_data/ams_weekly_fact/ams_weekly_fact_with_category.csv \
                  data/ams_weekly_data/processed_ads/ads_weekly_aggregated.csv \
                  data/ams_weekly_data/processed_ads/business_ads_joined.csv \
                  data/processed/sb_campaign_asins.json \
                  data/processed/sp_campaign_asins.json \
                  data/processed/sd_campaign_asins.json \
                  'data/processed/sb_unmapped_week*.csv' \
                  data/processed/weekly_sales_snapshot.csv \
                  data/processed/inventory_model_snapshot.csv \
                  data/processed/inventory_ams_snapshot.csv \
                  data/processed/pipeline_integrity_audit.xlsx \
                  data/processed/weekly_brief.md \
                  data/processed/returns_snapshot.csv \
                  data/processed/margin_snapshot.csv \
                  data/processed/inbound_snapshot.csv \
                  data/processed/reviews_snapshot.csv \
                  data/processed/price_snapshot.csv 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
            exit 0
          fi

          WEEK_LABEL=$(date -u -d '1 day ago' +%Y-%m-%d)
          git commit -m "chore(weekly-sync): auto-pull through $WEEK_LABEL"

          # Race-safe push: another commit may have landed on main while
          # this job's ~20-min report pull was running.  Pull --rebase
          # before pushing, retry up to 3 times if remote moves again.
          #
          # -X theirs: when a conflict happens during rebase (e.g. the
          # operator pushed a hand-edited weekly_brief.md or sku_master
          # mid-run), take THIS runner's freshly-generated version.
          # Then rebuild brief from the merged scripts + snapshots so
          # any script changes the operator pushed are still respected
          # in the final brief content.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash -X theirs origin main; then
              # Rebuild brief in case scripts/build_weekly_brief.py was
              # updated by the just-pulled commits.  No-op if the script
              # hasn't changed; amend silently if it has.
              python scripts/build_weekly_brief.py || true
              if ! git diff --quiet data/processed/weekly_brief.md 2>/dev/null; then
                git add data/processed/weekly_brief.md
                git commit --amend --no-edit
              fi
            else
              echo "Rebase failed on attempt $attempt; aborting and retrying."
              git rebase --abort || true
            fi
            if git push origin main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying after fetch..."
            sleep 5
          done
          echo "::error::Push failed after 3 attempts; remote keeps moving."
          exit 1
