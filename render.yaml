# Render blueprint — single web service, no server-side ETL.
#
# ETL workflow: the operator runs scripts/run_weekly_etl.py LOCALLY
# (which runs all six pipeline scripts in order), commits the produced
# data/processed/*.csv files, and pushes.  Render just serves them.
# This keeps the production server stateless and deterministic — what
# you see on the dashboard is exactly what's in git.
#
# Web service builds:
#   1. The Vite/React SPA bundle → weekly_app/static/spa/
#   2. Python deps via pip install -r requirements.txt
#   3. Boots uvicorn (serves /api/* JSON + the SPA shell)
services:
  - type: web
    name: weekly-dashboard
    runtime: python
    plan: starter
    region: singapore        # closest to operator's user base
    buildCommand: |
      npm --prefix frontend ci
      npm --prefix frontend run build
      # ── Sales Dashboard SPA (source: sales_dash_frontend/) ──
      # tsc gate + vite build; served by the /sales mount from sales_dash_dist.
      npm --prefix sales_dash_frontend ci
      VITE_BASE=/sales/ VITE_API_BASE=/sales-app npm --prefix sales_dash_frontend run build
      rm -rf sales_dash_dist && cp -r sales_dash_frontend/dist sales_dash_dist
      # ── Buybox Report (source: buybox_src/) ──
      # Snapshots are DERIVED HERE from all committed BSR CSVs — the upload
      # endpoint only commits raw CSVs (regenerating in-request OOM'd the
      # 512MB web instance; the build container has its own resources).
      python buybox_src/Scripts/build_bsr_snapshots.py
      # encrypt_data.js needs BUYBOX_PASSWORD from this service's env.
      npm --prefix buybox_src ci
      # raw_data.json is likewise DERIVED HERE from the committed monthly
      # CSVs (data/<Brand>/<MonYY>/) — the monthly-sync workflow and the
      # WM 1P upload endpoint only commit CSVs (added 2026-09-02 for the
      # Aug monthly refresh).
      node buybox_src/Scripts/generate_raw_data.js
      node buybox_src/Scripts/encrypt_data.js
      cd buybox_src && VITE_BASE=/buybox/ npx vite build && cd ..
      rm -rf buybox_dist && cp -r buybox_src/dist buybox_dist
      pip install -r requirements.txt
    # 2 workers so concurrent /api/* fanout from the SPA's first paint
    # doesn't queue behind a single uvicorn process.  Each worker has
    # its own df_cache; the startup warm-up populates both on boot.
    startCommand: uvicorn weekly_app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SESSION_SECRET
        sync: false            # set manually in Render dashboard
      - key: COOKIE_SECURE
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONIOENCODING
        value: "utf-8"
      - key: NODE_VERSION
        value: "20"
      - key: PYTHON_VERSION
        value: "3.11"
