<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot password — Weekly Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/font_scale.css">
<style>
    :root {
        --bg:           #f5f6fa;
        --card:         #ffffff;
        --border:       #e8eaf0;
        --border2:      #d5d9e6;
        --primary:      #3d3587;
        --primary-dark: #4a3f9e;
        --text:         #111827;
        --text2:        #374151;
        --error:        #b91c1c;
        --error-bg:     #fef2f2;
        --info:         #0a6e4e;
        --info-bg:      #ecfdf6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        padding: 24px;
    }
    .card { background: #fff; width: 100%; max-width: 420px; border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06); border: 1px solid var(--border); overflow: hidden; }
    .head { background: var(--primary); color: #fff; padding: 20px 28px; }
    .head h1 { font-weight: 700; }
    .head .sub { color: rgba(255,255,255,0.7); margin-top: 4px; }
    .body { padding: 24px 28px 28px; }
    label { display: block; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
    input { width: 100%; padding: 9px 12px; border: 1px solid var(--border2); border-radius: 6px;
            background: #f8f9fc; outline: none; margin-bottom: 14px;
            transition: border-color .15s, background .15s; }
    input:focus { border-color: var(--primary); background: #fff; }
    .btn { width: 100%; padding: 10px 12px; background: var(--primary); color: #fff;
           border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background .15s; }
    .btn:hover { background: var(--primary-dark); }
    .alert { padding: 9px 12px; border-radius: 6px; margin-bottom: 14px; }
    .alert.error { color: var(--error); background: var(--error-bg); border: 1px solid #fecaca; }
    .alert.info  { color: var(--info);  background: var(--info-bg);  border: 1px solid #b8e5d2; }
    .links { margin-top: 14px; }
    .links a { color: var(--primary); text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    .help { color: #6b7280; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="card">
    <div class="head">
        <h1>🔑 Forgot password</h1>
        <div class="sub">We'll send a reset link to your email</div>
    </div>
    <div class="body">
        {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
        {% if info %}<div class="alert info">{{ info }}</div>{% endif %}
        <p class="help">Enter the email associated with your account. If it exists, a reset link valid for 30 minutes will be sent.</p>
        <form method="post" action="/forgot-password">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required autofocus>
            <button class="btn" type="submit">Send reset link</button>
        </form>
        <div class="links">
            <a href="/login">← Back to sign in</a>
        </div>
    </div>
</div>
</body>
</html>
